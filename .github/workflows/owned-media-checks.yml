name: Owned media server checks
on:
  pull_request:
    paths: ['infra/owned-media/**', 'scripts/test-owned-media-server.mjs', '.github/workflows/owned-media-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-linux-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-owned-media-server.mjs
