name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high --ignore-scripts
      - run: npm run test:security
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run test:providers
      - run: npm run test:payments
      - run: npm run test:identity-roles
      - run: npm run test:account-recovery
      - run: npm run test:auth-revocation
      - name: Verify disposable PostgreSQL revocation barriers
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin
        run: |
          test -x "$PG_BINDIR/initdb"
          test -x "$PG_BINDIR/postgres"
          npm run test:auth-revocation-postgres
      - run: npm run test:jobs
      - run: npm run test:support
      - run: npm run test:chale-workflow
      - run: npm run test:chale-work-status
      - run: node scripts/test-direct-messages.mjs
